<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>domain-watcher</title>
  <link rel="icon" type="image/png" href="/static/emblem.png" />
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/2.0.3/htmx.min.js"></script>
</head>
<body>
  <header>
    <img class="mark" src="/static/emblem.png" alt="" />
    <h1><a href="/" class="plain">domain-watcher</a></h1>
    <a href="/settings" class="gear" title="Settings" aria-label="Settings">⚙</a>
  </header>

  <main>
    <p class="motd">adept@lab:~$ ./watch --daily<span class="cursor">▋</span></p>
    <section class="card">
      <div class="card-head">
        <h2>// watchlist</h2>
        <button class="btn primary" hx-post="/check" hx-target="#rows"
                hx-indicator="#rows" hx-swap="outerHTML settle:700ms">run check now</button>
      </div>

      <div class="table">
        <div class="thead thead-slim">
          <span>domain</span><span>status</span><span>expiry</span><span>last check</span><span>watch</span><span></span>
        </div>
        {% include "_rows.html" %}
      </div>

      <form class="add" hx-post="/domains" hx-target="#rows" hx-swap="outerHTML settle:700ms"
            hx-on::after-request="this.reset()">
        <input name="domain" placeholder="example.com" required autocomplete="off" />
        <input name="note" placeholder="note (optional)" autocomplete="off" />
        <button class="btn">+ add domain</button>
      </form>
      <p class="hint">Click a domain for its settings, snapshot, and alert options.</p>
    </section>
  </main>

  <footer>// code-signed by <span class="sig">AdepT_X</span> · domain-watcher v{{ version }} · <span id="quip">the watch never sleeps</span></footer>
  <script>
    const QUIPS = [
      "never lose a drop by six days again",
      "the watch never sleeps",
      "tick tock, pendingDelete",
      "your move, drop-catchers",
      "somewhere, a registrar is nervous",
      "expiry is just a countdown with stakes",
      "backorders ready. eyes open.",
      "rdap never lies (mostly)",
    ];
    document.getElementById("quip").textContent = QUIPS[Math.floor(Math.random() * QUIPS.length)];
  </script>
</body>
</html>
